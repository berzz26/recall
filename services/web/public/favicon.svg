<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ReCall">
  <title>ReCall</title>
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <rect width="32" height="32" rx="8" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <!-- white magnifier -->
  <circle cx="15.5" cy="15.2" r="6.2" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  <!-- green play inside -->
  <path d="M13.2 13.1 L13.2 17.8 L17.9 15.45 Z" fill="#10a37f" stroke="#10a37f" stroke-linejoin="round" stroke-width="1.1"/>
  <!-- handle -->
  <path d="M19.7 19.4 L24.2 23.9" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- outer recall ring - perfect circle with uniform stroke and clean gap -->
  <circle cx="15.5" cy="15.2" r="8.2" fill="none" stroke="#10a37f" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="46.9 4.6" stroke-dashoffset="0" transform="rotate(-32 15.5 15.2)" opacity="0.98"/>
  <!-- arrow head - centered on gap, consistent stroke -->
  <path d="M 20.95 8.75 L 22.48 10.92 L 20.15 12.15" fill="none" stroke="#10a37f" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"/>
</svg>
